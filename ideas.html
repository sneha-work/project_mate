<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Innovative Research Idea Lab — ResearchMate AI</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Navigation Bar -->
    <header class="navbar-top">
      <div class="nav-container">
        <a href="/" class="brand-link">
          <span class="brand-name">ResearchMate</span>
        </a>

        <nav class="nav-links">
          <a href="/formatter" class="nav-link">Paper Formatter</a>
          <a href="/slides" class="nav-link">Deck Maker</a>
          <a href="/literature" class="nav-link">Literature Discovery</a>
          <a href="/ideas" class="nav-link active">Idea Lab</a>
          <a href="/conferences" class="nav-link">Conferences</a>
          <a href="/history" class="nav-link">History</a>
        </nav>

        <div class="nav-actions">
          <button id="themeToggleBtn" class="icon-btn" aria-label="Toggle Theme" title="Toggle Dark/Light Mode">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
          <a href="/settings" class="icon-btn" aria-label="Settings" title="Settings">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </a>
          <a href="/profile" class="icon-btn" aria-label="Profile" title="Profile">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </a>
        </div>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="main-wrapper">
      <div style="display: flex; justify-content: flex-end; margin-bottom: 14px;">
        <button id="downloadTopProposalBtn" class="btn-pill-primary" style="display: none;">📥 Download Proposal PDF</button>
      </div>

      <!-- Ideation Setup Bar -->
      <section style="background: var(--bg-card); border: 1px solid var(--border-light); border-radius: var(--card-radius); padding: 28px; box-shadow: var(--shadow-sm); margin-bottom: 24px;">
        <h2 style="font-size: 22px; font-weight: 700; color: var(--text-main); margin-bottom: 6px;">
          Generate Innovative Research Ideas & Proposals
        </h2>
        <p style="font-size: 13.5px; color: var(--text-muted); margin-bottom: 16px;">
          Formulate novel hypotheses, discover critical literature gaps, outline mathematical architectures, and design benchmark protocols.
        </p>

        <form id="ideaForm" style="display: grid; grid-template-columns: 2fr 1fr 1fr 160px; gap: 14px; align-items: end; margin-bottom: 16px;">
          <div class="autocomplete-wrapper">
            <label style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Research Topic / Problem</label>
            <input type="text" id="ideaTopicInput" class="form-control autocomplete-input" style="height: 42px; margin-top: 4px;" placeholder="e.g. Mechanistic Interpretability in Transformers" value="Hallucination Mitigation in Real-Time RAG Pipelines">
          </div>
          <div>
            <label style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Discipline Domain</label>
            <select id="ideaDomainSelect" class="form-control" style="height: 42px; margin-top: 4px;">
              <option value="Computer Science & AI" selected>Computer Science & AI</option>
              <option value="Cybersecurity & Cryptography">Cybersecurity & Cryptography</option>
              <option value="Bioinformatics & Genomics">Bioinformatics & Genomics</option>
              <option value="Robotics & Control Systems">Robotics & Control Systems</option>
              <option value="Quantum Information Science">Quantum Information Science</option>
            </select>
          </div>
          <div>
            <label style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Target Focus</label>
            <select id="ideaFocusSelect" class="form-control" style="height: 42px; margin-top: 4px;">
              <option value="Breakthrough Methodology" selected>Breakthrough Method</option>
              <option value="Efficiency & Acceleration">Efficiency & Acceleration</option>
              <option value="Provable Theoretical Bounds">Theoretical Bounds</option>
              <option value="Interdisciplinary Synthesis">Interdisciplinary</option>
            </select>
          </div>
          <div>
            <button type="submit" class="btn-pill-primary" style="height: 42px; width: 100%; justify-content: center;">
              💡 Brainstorm
            </button>
          </div>
        </form>

        <!-- Trending Pills -->
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
          <span style="font-size: 12px; font-weight: 700; color: var(--text-muted);">Trending Domains:</span>
          <button class="btn-sm" onclick="setTopic('Post-Quantum Hardware Lattice Acceleration')">Post-Quantum Hardware</button>
          <button class="btn-sm" onclick="setTopic('Diffusion Models for Single-Cell RNA Conformation')">Single-Cell RNA Diffusion</button>
          <button class="btn-sm" onclick="setTopic('Zero-Knowledge Verification for Deep Learning')">ZK-Machine Learning</button>
          <button class="btn-sm" onclick="setTopic('Event-Based Neuromorphic Drone Perception')">Neuromorphic Drones</button>
        </div>
      </section>

      <!-- Ideas Display Container -->
      <section id="ideationContainer">
        <!-- Generated ideas will be populated here -->
      </section>
    </main>
  </div>

  <script src="/static/js/main.js"></script>
  <script>
    let topProposalPdfUrl = null;

    document.getElementById("ideaForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const topic = document.getElementById("ideaTopicInput").value.trim();
      const domain = document.getElementById("ideaDomainSelect").value;
      const focus = document.getElementById("ideaFocusSelect").value;
      if (topic) generateIdeas(topic, domain, focus);
    });

    function setTopic(t) {
      document.getElementById("ideaTopicInput").value = t;
      generateIdeas(t, document.getElementById("ideaDomainSelect").value, document.getElementById("ideaFocusSelect").value);
    }

    async function generateIdeas(topic, domain, focus) {
      showToast(`Generating innovative proposals for "${topic}"...`);
      const container = document.getElementById("ideationContainer");
      container.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--text-muted);">⚡ Synthesizing mathematical hypotheses and experimental designs...</div>`;

      try {
        const res = await fetch("/api/ideas/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic, domain, focus })
        });
        const data = await res.json();
        if (data.ideas && data.ideas.length > 0) {
          topProposalPdfUrl = data.top_idea_pdf_url;
          document.getElementById("downloadTopProposalBtn").style.display = "inline-flex";
          renderIdeas(data.ideas);
          showToast(`Generated ${data.ideas.length} comprehensive proposals!`);
        }
      } catch (err) {
        showToast("Error generating research ideas", "error");
      }
    }

    function renderIdeas(ideas) {
      const container = document.getElementById("ideationContainer");
      container.innerHTML = "";

      ideas.forEach((item, idx) => {
        const card = document.createElement("article");
        card.style.cssText = `
          background: var(--bg-card);
          border: 1px solid var(--border-light);
          border-radius: var(--card-radius);
          padding: 24px;
          margin-bottom: 20px;
          box-shadow: var(--shadow-sm);
        `;
        card.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 12px;">
            <div>
              <span class="btn-sm" style="font-size: 11px; background: var(--c-blush); color: var(--c-deep-burgundy); font-weight: 700; margin-bottom: 6px;">PROPOSAL #${idx + 1} &bull; ${item.domain}</span>
              <h3 style="font-size: 18px; font-weight: 800; color: var(--text-main); line-height: 1.3;">${item.title}</h3>
            </div>
            <div style="text-align: right; flex-shrink: 0;">
              <span class="btn-sm" style="font-size: 11px; background: #ecfdf5; color: #047857; font-weight: 700;">Feasibility: ${item.feasibility}</span>
              <div style="font-size: 11.5px; color: var(--text-muted); margin-top: 4px;">Timeline: ${item.timeline}</div>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
            <div style="background: var(--bg-card-subtle); padding: 14px; border-radius: 12px; border-left: 3px solid var(--c-rich-burgundy);">
              <div style="font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase;">1. Core Hypothesis & Problem</div>
              <p style="font-size: 13px; color: var(--text-main); margin-top: 4px; line-height: 1.45;">${item.hypothesis}</p>
            </div>
            <div style="background: var(--bg-card-subtle); padding: 14px; border-radius: 12px; border-left: 3px solid var(--c-dusty-rose);">
              <div style="font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase;">2. Critical Literature Gap</div>
              <p style="font-size: 13px; color: var(--text-main); margin-top: 4px; line-height: 1.45;">${item.novelty}</p>
            </div>
          </div>

          <div style="margin-bottom: 16px;">
            <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">3. Proposed Methodology & Mathematical Framework</div>
            <pre style="white-space: pre-wrap; font-family: var(--font-main); font-size: 13px; color: var(--text-main); background: var(--bg-card-subtle); padding: 12px; border-radius: 10px; margin-top: 4px; border: 1px solid var(--border-light); line-height: 1.45;">${item.methodology}</pre>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
            <div>
              <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">4. Experimental Protocol & Datasets</div>
              <p style="font-size: 12.5px; color: var(--text-muted); margin-top: 2px;">${item.experiments}</p>
            </div>
            <div>
              <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">5. Challenges & Mitigations</div>
              <p style="font-size: 12.5px; color: var(--text-muted); margin-top: 2px;">${item.challenges}</p>
            </div>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-light); padding-top: 12px; flex-wrap: wrap; gap: 10px;">
            <div style="font-size: 12px; color: var(--text-muted);">
              <b>Target Venues:</b> <span style="color: var(--accent); font-weight: 600;">${item.target_venues}</span>
            </div>
            <div style="display: flex; gap: 8px;">
              <button class="btn-sm" onclick='saveIdeaToLibrary(${JSON.stringify(item)})'>💾 Save Proposal</button>
              <a href="/slides?ref=${encodeURIComponent(item.title)}" class="btn-sm" style="background: var(--c-blush); color: var(--c-deep-burgundy);">📊 Generate Slides Deck</a>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function saveIdeaToLibrary(idea) {
      try {
        const res = await fetch("/api/library/save_idea", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(idea)
        });
        showToast("Research proposal saved to Library!");
      } catch (err) {
        showToast("Error saving idea", "error");
      }
    }

    document.getElementById("downloadTopProposalBtn").addEventListener("click", () => {
      if (topProposalPdfUrl) {
        window.location.href = topProposalPdfUrl;
        showToast("Downloading formatted Proposal PDF!");
      }
    });

    // Auto-generate on initial load
    window.addEventListener("load", () => {
      generateIdeas("Hallucination Mitigation in Real-Time RAG Pipelines", "Computer Science & AI", "Breakthrough Methodology");
    });
  </script>
</body>
</html>
