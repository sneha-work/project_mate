<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholar History & Saved Library — ResearchMate AI</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Navigation Bar -->
    <header class="navbar-top">
      <div class="nav-container">
        <a href="/" class="brand-link">
          <span class="brand-name">ResearchMate</span>
        </a>

        <nav class="nav-links">
          <a href="/formatter" class="nav-link">Paper Formatter</a>
          <a href="/slides" class="nav-link">Deck Maker</a>
          <a href="/literature" class="nav-link">Literature Discovery</a>
          <a href="/ideas" class="nav-link">Idea Lab</a>
          <a href="/conferences" class="nav-link">Conferences</a>
          <a href="/history" class="nav-link active">History</a>
        </nav>

        <div class="nav-actions">
          <button id="themeToggleBtn" class="icon-btn" aria-label="Toggle Theme" title="Toggle Dark/Light Mode">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
          <a href="/settings" class="icon-btn" aria-label="Settings" title="Settings">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </a>
          <a href="/profile" class="icon-btn" aria-label="Profile" title="Profile">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </a>
        </div>
      </div>
    </header>

    <main class="main-wrapper">
      <div style="display: flex; justify-content: flex-end; margin-bottom: 14px;">
        <button id="clearHistoryBtn" class="btn-sm" style="color: #b91c1c;">Clear History</button>
      </div>

      <section style="background: var(--bg-card); border: 1px solid var(--border-light); border-radius: var(--card-radius); padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 24px;">
        <h2 style="font-size: 22px; font-weight: 700; color: var(--text-main); margin-bottom: 6px;">Scholar Activity & Library</h2>
        <div style="display: flex; gap: 8px; margin-top: 14px; border-bottom: 1px solid var(--border-light); padding-bottom: 12px; flex-wrap: wrap;">
          <button class="btn-sm filter-tab active" onclick="loadTab('all', this)">All History</button>
          <button class="btn-sm filter-tab" onclick="loadTab('formatter', this)">Formatted Papers</button>
          <button class="btn-sm filter-tab" onclick="loadTab('slides', this)">Slide Decks</button>
          <button class="btn-sm filter-tab" onclick="loadTab('papers', this)">Saved Literature</button>
          <button class="btn-sm filter-tab" onclick="loadTab('ideas', this)">Saved Ideas</button>
          <button class="btn-sm filter-tab" onclick="loadTab('conferences', this)">Saved Conferences</button>
        </div>
      </section>

      <section id="historyListContainer">
        <!-- Rendered items -->
      </section>
    </main>
  </div>

  <script src="/static/js/main.js"></script>
  <script>
    let currentTab = "all";

    function loadTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll(".filter-tab").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
      fetchHistory();
    }

    async function fetchHistory() {
      const container = document.getElementById("historyListContainer");
      container.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--text-muted);">Loading library history...</div>`;

      try {
        const res = await fetch(`/api/history?type=${currentTab}`);
        const data = await res.json();
        renderHistoryItems(data.items || []);
      } catch (e) {
        showToast("Error loading history", "error");
      }
    }

    function renderHistoryItems(items) {
      const container = document.getElementById("historyListContainer");
      container.innerHTML = "";

      if (items.length === 0) {
        container.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--text-muted); background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border-light);">No items in this category yet. Start by formatting a paper or exploring literature!</div>`;
        return;
      }

      items.forEach(it => {
        const card = document.createElement("article");
        card.style.cssText = `
          background: var(--bg-card);
          border: 1px solid var(--border-light);
          border-radius: 16px;
          padding: 18px 24px;
          margin-bottom: 14px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 16px;
        `;
        card.innerHTML = `
          <div>
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
              <span class="btn-sm" style="font-size: 10.5px; padding: 2px 8px; background: var(--c-blush); color: var(--c-deep-burgundy); font-weight: 700;">${it.feature.toUpperCase()}</span>
              <span style="font-size: 12px; color: var(--text-muted);">${it.created_at || 'Recently'}</span>
            </div>
            <h3 style="font-size: 16px; font-weight: 700; color: var(--text-main);">${it.title}</h3>
            <p style="font-size: 12.5px; color: var(--text-muted); margin-top: 2px;">${it.summary || ''}</p>
          </div>
          <div style="display: flex; gap: 8px; flex-shrink: 0;">
            ${it.file_path ? `<a href="/api/download?file=${encodeURIComponent(it.file_path)}" class="btn-sm btn-sm-primary">📥 Download File</a>` : ''}
            <button class="btn-sm" onclick="deleteItem(${it.id})" style="color: #b91c1c;">🗑️ Delete</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function deleteItem(id) {
      try {
        await fetch(`/api/history/${id}`, { method: "DELETE" });
        showToast("Item deleted from history");
        fetchHistory();
      } catch (e) {
        showToast("Error deleting item", "error");
      }
    }

    document.getElementById("clearHistoryBtn").addEventListener("click", async () => {
      if (confirm("Are you sure you want to clear your history?")) {
        try {
          await fetch(`/api/history/clear?type=${currentTab}`, { method: "POST" });
          showToast("History cleared!");
          fetchHistory();
        } catch (e) {
          showToast("Error clearing history", "error");
        }
      }
    });

    window.addEventListener("load", fetchHistory);
  </script>
</body>
</html>
